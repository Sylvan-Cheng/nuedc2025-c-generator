[project]
name = "nuedc2025-c-generator"
version = "0.1.0"
description = "标准化测试图案生成器 — 2025年全国大学生电子设计竞赛C题"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "svgwrite>=1.4",
    "resvg-py>=0.3",
    "svglib>=1.6",
    "reportlab>=4.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuedc_gen"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[project.scripts]
nuedc-gen = "nuedc_gen.__main__:main"
